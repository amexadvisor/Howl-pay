<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch Ads & Earn Bonus</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Ads Galaxy SDK (App ID: 57) -->
  <script src="https://app.adsgalaxy.online/sdk.js?id=57"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #121212);
      color: var(--tg-theme-text-color, #ffffff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background-color: var(--tg-theme-secondary-bg-color, #1e1e1e);
      border-radius: 16px;
      padding: 24px 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }
    .logo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      border: 3px solid #0088cc;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .instructions {
      font-size: 14px;
      color: var(--tg-theme-hint-color, #a0a0a0);
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .btn {
      width: 100%;
      background-color: var(--tg-theme-button-color, #0088cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
    }
    .btn:disabled {
      background-color: #383838;
      color: #888888;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="https://i.ibb.co/SDdZDqpq/Pokecut-1788095357320.png" alt="Logo" class="logo">
    <div class="title">Bonus Reward</div>
    <div class="instructions">
      Watch and complete the sponsored ad. Once verified by the ad network, <strong>$0.005</strong> will be credited directly to your bot balance.
    </div>

    <button class="btn" id="bonusBtn" onclick="handleAdClick()">Watch Ad & Earn</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    const USER_ID = tg.initDataUnsafe?.user?.id;

    function handleAdClick() {
      tg.showConfirm("Ready to watch the sponsored ad?", function(confirmed) {
        if (confirmed) {
          showAd();
        }
      });
    }

    function showAd() {
      const btn = document.getElementById('bonusBtn');
      btn.disabled = true;

      // Pass user_id to AdsGalaxy for Server-to-Server postback
      window.showAdsGalaxy({ user_id: USER_ID })
        .then(function (result) {
          tg.showAlert("🎉 Ad complete! Your reward is being credited via the ad network.", function() {
            tg.close();
          });
        })
        .catch(function (error) {
          btn.disabled = false;
          if (error.code === "NO_FILL") return tg.showAlert("No ad available right now. Please try again later.");
          if (error.code === "INVALID_INIT_DATA") return tg.showAlert("Please launch this app inside Telegram.");
          tg.showAlert("Ad was closed early. Complete the full ad to receive your reward.");
        });
    }
  </script>
</body>
</html>
