<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offerwall Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .profile-card {
            background: var(--tg-theme-secondary-bg-color, #f1f1f1);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 12px;
            border: 2px solid var(--tg-theme-button-color, #2481cc);
        }
        .name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .userid {
            font-size: 0.9rem;
            color: var(--tg-theme-hint-color, #707579);
            margin-bottom: 15px;
        }
        .offerwall-btn {
            display: inline-block;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <img id="avatar" class="avatar" src="https://via.placeholder.com/80" alt="Profile Photo">
        <div id="name" class="name">Loading user...</div>
        <div id="userid" class="userid">ID: --</div>
        <a id="offerwallLink" href="#" class="offerwall-btn" target="_blank">Open Offerwall</a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        const user = tg.initDataUnsafe && tg.initDataUnsafe.user;

        if (user) {
            document.getElementById('name').textContent = `${user.first_name} ${user.lastName || ''}`.trim();
            document.getElementById('userid').textContent = `ID: ${user.id}`;
            
            if (user.photo_url) {
                document.getElementById('avatar').src = user.photo_url;
            }

            const appId = "xX8xgdqTIsgOpXHcngm5uiEaDb1wPM";
            const offerwallUrl = `https://offerwall.me/?appid=${appId}&subid=${user.id}`;
            document.getElementById('offerwallLink').href = offerwallUrl;
        } else {
            document.getElementById('name').textContent = "Web Preview Mode";
            document.getElementById('userid').textContent = "ID: 123456789 (Test)";
            document.getElementById('offerwallLink').href = "https://offerwall.me/?appid=YOUR_APP_ID&subid=123456789";
        }
    </script>
</body>
</html>
