<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch & Click Ads</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Ads Galaxy SDK (App ID: 57) -->
  <script src="https://app.adsgalaxy.online/sdk.js?id=57"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #121212);
      color: var(--tg-theme-text-color, #ffffff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background-color: var(--tg-theme-secondary-bg-color, #1e1e1e);
      border-radius: 16px;
      padding: 24px 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      border: 3px solid #0088cc;
      box-shadow: 0 4px 12px rgba(0, 136, 204, 0.3);
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .instructions {
      font-size: 14px;
      color: var(--tg-theme-hint-color, #a0a0a0);
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .progress-box {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 20px;
    }
    .counter {
      font-size: 16px;
      font-weight: 600;
      color: #00d26a;
    }
    .btn {
      width: 100%;
      background-color: var(--tg-theme-button-color, #0088cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn:disabled {
      background-color: #383838;
      color: #888888;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="https://i.ibb.co/SDdZDqpq/Pokecut-1788095357320.png" alt="Logo" class="logo">
    <div class="title">Bonus Reward</div>
    <div class="instructions">
      Watch and <strong>click on 3 sponsor ads</strong> to earn <strong>$0.002</strong> directly into your account balance.
    </div>

    <div class="progress-box">
      <div class="counter" id="adCounter">Ads Completed: 0 / 3</div>
    </div>

    <button class="btn" id="bonusBtn" onclick="handleAdClick()">Watch & Click Ad (1/3)</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    const REQUIRED_ADS = 3;
    let adsCount = 0;
    let userClickedAd = false;

    // Detect when the user clicks the ad (browser leaves/blurs the app window)
    window.addEventListener("blur", function () {
      userClickedAd = true;
    });

    function handleAdClick() {
      userClickedAd = false;
      const btn = document.getElementById('bonusBtn');
      btn.disabled = true;
      btn.innerText = "Opening ad...";

      tg.showConfirm("⚠️ Important: You MUST click on the sponsor ad to receive the reward!", function(confirmed) {
        if (!confirmed) {
          btn.disabled = false;
          updateBtnText();
          return;
        }

        window.showAdsGalaxy()
          .then(function (result) {
            // Give 1 second for click detection event to register if clicked at end
            setTimeout(function() {
              adsCount++;
              document.getElementById('adCounter').innerText = `Ads Completed: ${adsCount} / ${REQUIRED_ADS}`;

              if (adsCount < REQUIRED_ADS) {
                btn.disabled = false;
                updateBtnText();
                tg.showAlert(`✅ Ad ${adsCount}/${REQUIRED_ADS} verified! Complete the next one.`);
              } else {
                btn.innerText = "Crediting $0.002...";
                sendReward();
              }
            }, 1000);
          })
          .catch(function (error) {
            btn.disabled = false;
            updateBtnText();
            if (error.code === "NO_FILL") return tg.showAlert("No ad available right now. Please try again shortly.");
            if (error.code === "INVALID_INIT_DATA") return tg.showAlert("Please launch this app inside Telegram.");
            tg.showAlert("Ad closed early without click interaction.");
          });
      });
    }

    function updateBtnText() {
      const btn = document.getElementById('bonusBtn');
      btn.innerText = `Watch & Click Ad (${adsCount + 1}/${REQUIRED_ADS})`;
    }

    async function sendReward() {
      const btn = document.getElementById('bonusBtn');

      try {
        const response = await fetch("/api/claim-bonus", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            user_id: tg.initDataUnsafe?.user?.id,
            initData: tg.initData
          })
        });

        const contentType = response.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) {
          const text = await response.text();
          throw new Error("Server returned HTML instead of JSON: " + text.slice(0, 100));
        }

        const data = await response.json();

        if (response.ok && data.success) {
          tg.showAlert("🎉 $0.002 has been added to your balance!", function() {
            tg.close();
          });
        } else if (data.cooldown) {
          tg.showAlert(`⏳ Cooldown active! Please wait ${data.minutes_left} more minutes.`);
          tg.close();
        } else {
          tg.showAlert("⚠️ " + (data.error || "Claim failed."));
          btn.disabled = false;
          updateBtnText();
        }
      } catch (err) {
        tg.showAlert("Error: " + err.message);
        btn.disabled = false;
        updateBtnText();
      }
    }
  </script>
</body>
</html>
