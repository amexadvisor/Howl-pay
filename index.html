<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HOWL | Elite Earning Platform</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- AdsBitVex SDK with correct App ID: 000402 -->
  <script src="https://sdk.adsbitvex.com/functions/v1/ad-script?appid=000402"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #070c0e;
      --card: #12191b;
      --card-alt: #0f2a25;
      --hairline: rgba(255, 255, 255, 0.07);
      --mint: #34d399;
      --mint-dim: #10b981;
      --mint-soft: rgba(52, 211, 153, 0.12);
      --mint-glow: rgba(52, 211, 153, 0.28);
      --text: #f5f7f8;
      --text-muted: #8b959a;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; padding: 0; background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center;
      height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased;
    }

    /* ============ Splash Animation ============ */
    #splash-screen {
      position: absolute; inset: 0; background: var(--bg); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }
    #splash-screen.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }

    .howl-glow {
      position: absolute; top: 22%; left: 50%; width: 320px; height: 320px; border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, var(--mint-soft) 0%, transparent 70%);
      animation: moonPulse 3.2s ease-in-out infinite;
    }
    @keyframes moonPulse { 0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } }

    .howl-rings { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .howl-rings .ring {
      position: absolute; border-radius: 50%; border: 1px solid var(--mint-glow);
      animation: sonar 2.6s cubic-bezier(0.2, 0.6, 0.4, 1) infinite; opacity: 0;
    }
    .howl-rings .r1 { animation-delay: 0s; }
    .howl-rings .r2 { animation-delay: 0.87s; }
    .howl-rings .r3 { animation-delay: 1.74s; }
    @keyframes sonar { 0% { width: 88px; height: 88px; opacity: 0.5; } 100% { width: 320px; height: 320px; opacity: 0; } }

    .splash-logo-container {
      position: relative; width: 88px; height: 88px; display: flex; align-items: center; justify-content: center;
      margin-bottom: 24px; z-index: 2; animation: logoRise 0.7s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes logoRise { from { opacity: 0; transform: translateY(12px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }

    .splash-logo {
      width: 88px; height: 88px; border-radius: 24px;
      background: var(--card);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      border: 1px solid var(--hairline);
      box-shadow: 0 0 28px var(--mint-glow);
    }
    .splash-logo img { width: 100%; height: 100%; object-fit: cover; }

    .splash-title-wrapper { text-align: center; z-index: 2; margin-bottom: 22px; }
    .splash-title {
      font-family: 'Inter', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: 0.5px; color: var(--text);
      margin: 0 0 6px 0;
      animation: fadeIn 0.6s ease both 0.15s; opacity: 0;
    }
    @keyframes fadeIn { to { opacity: 1; } }
    .splash-subtitle {
      font-size: 12px; font-weight: 600; color: var(--text-muted);
      opacity: 0; animation: fadeIn 0.5s ease both 0.45s;
    }

    .splash-loader-container { width: 200px; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .splash-loader { width: 100%; height: 4px; background: rgba(255,255,255,0.08); border-radius: 4px; position: relative; overflow: hidden; }
    .splash-loader-bar {
      position: absolute; top: 0; left: 0; height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--mint-dim), var(--mint));
      border-radius: 4px; transition: width 0.25s ease-out;
    }
    .splash-percentage { font-family: 'Inter', monospace; font-size: 11px; color: var(--text-muted); font-weight: 600; }

    /* ============ Main Container Layout ============ */
    .container {
      width: 100%; height: 100%; max-width: 410px; background: var(--bg);
      display: flex; flex-direction: column; overflow: hidden; position: relative;
      border-left: 1px solid var(--hairline); border-right: 1px solid var(--hairline);
    }

    .live-dashboard-bg { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .live-grid { position: absolute; top: -10%; left: 0; width: 100%; height: 240px; background: radial-gradient(ellipse at 50% 0%, var(--mint-soft) 0%, transparent 70%); }

    main { flex-grow: 1; overflow-y: auto; padding: 18px; padding-bottom: 40px; z-index: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }

    .card {
      background-color: var(--card);
      border-radius: 18px;
      padding: 24px 20px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid var(--hairline);
    }
    .logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      border: 3px solid var(--mint);
      box-shadow: 0 4px 12px var(--mint-glow);
    }
    .profile-section {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 14px;
      padding: 12px 16px;
      width: 100%;
      margin-bottom: 16px;
      text-align: left;
      border: 1px solid var(--hairline);
    }
    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--mint);
      background-color: var(--card-alt);
      flex-shrink: 0;
    }
    .user-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .name {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .userid {
      font-size: 12px;
      color: var(--text-muted);
      font-family: monospace;
      margin-top: 2px;
    }
    .title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--text);
    }
    .instructions {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .progress-box {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--hairline);
    }
    .counter {
      font-size: 15px;
      font-weight: 700;
      color: var(--mint);
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--mint), var(--mint-dim));
      color: #06120e;
      border: none;
      padding: 15px;
      font-size: 15px;
      font-weight: 800;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.25s ease;
      box-shadow: 0 8px 20px var(--mint-glow);
      margin-bottom: 12px;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      box-shadow: none;
      cursor: not-allowed;
    }
    .btn-secondary {
      background-color: transparent;
      border: 2px solid var(--mint);
      color: var(--mint);
    }
    .back-btn {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--hairline);
      margin-top: 12px;
      margin-bottom: 0;
      box-shadow: none;
    }
    .hidden {
      display: none !important;
    }

    /* Fullscreen Offerwall Modal View */
    #offerwallView {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(7, 12, 14, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }
    .offerwall-wrapper {
      width: 100%;
      max-width: 380px;
      height: 78vh;
      background-color: var(--card);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--hairline);
    }
    .offerwall-iframe-container {
      width: 100%;
      flex-grow: 1;
      overflow: hidden;
    }
    #offerwallFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }
    .offerwall-footer {
      width: 100%;
      padding: 12px 16px;
      background-color: var(--card);
      display: flex;
      justify-content: center;
      border-top: 1px solid var(--hairline);
    }
    .offerwall-back-btn {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--hairline);
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Opening Splash Screen with HOWL Logo & Animation -->
  <div id="splash-screen">
    <div class="howl-glow"></div>
    <div class="howl-rings">
      <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
    </div>

    <div class="splash-logo-container">
      <div class="splash-logo">
        <img src="https://i.ibb.co/2mX3Qcm/IMG-20260805-193857-910.jpg" alt="HOWL Emblem">
      </div>
    </div>

    <div class="splash-title-wrapper">
      <h1 class="splash-title">HOWL</h1>
      <div class="splash-subtitle">Elite Earning Protocol</div>
    </div>

    <div class="splash-loader-container">
      <div class="splash-loader"><div class="splash-loader-bar" id="loaderBar"></div></div>
      <div class="splash-percentage" id="loaderPercent">0%</div>
    </div>
  </div>

  <div class="container">
    <div class="live-dashboard-bg">
      <div class="live-grid"></div>
    </div>

    <main>
      <!-- MAIN MENU VIEW -->
      <div class="card" id="mainMenu">
        <img src="https://i.ibb.co/2mX3Qcm/IMG-20260805-193857-910.jpg" alt="Logo" class="logo">
        
        <!-- User Profile Dashboard Card -->
        <div class="profile-section" id="userProfileCard" style="display: none;">
          <img id="userAvatar" class="avatar" src="" alt="Avatar">
          <div class="user-info">
            <div id="userName" class="name">Loading...</div>
            <div id="userId" class="userid">ID: --</div>
          </div>
        </div>

        <div class="title">Earning Hub</div>
        <div class="instructions">
          Choose an option below to start earning rewards directly to your account.
        </div>

        <button class="btn" onclick="switchView('adsView')">📺 Watch Ads</button>
        <button class="btn btn-secondary" onclick="openOfferwall()">📋 Offerwall & Surveys</button>
      </div>

      <!-- ADS VIEW -->
      <div class="card hidden" id="adsView">
        <div class="title">Watch Ads</div>
        <div class="instructions">
          Watch and complete <strong>3 sponsor ads</strong> to unlock bonuses.
        </div>

        <div class="progress-box">
          <div class="counter" id="adCounter">Ads Completed: 0 / 3</div>
        </div>

        <button class="btn" id="bonusBtn" onclick="handleAdClick()">Watch Ad (1/3)</button>
        <button class="btn back-btn" onclick="switchView('mainMenu')">⬅ Back to Menu</button>
      </div>
    </main>
  </div>

  <!-- REDUCED OFFERWALL MODAL/CONTAINER VIEW -->
  <div class="hidden" id="offerwallView">
    <div class="offerwall-wrapper">
      <div class="offerwall-iframe-container">
        <iframe id="offerwallFrame" src="" allowpaymentrequest></iframe>
      </div>
      <div class="offerwall-footer">
        <button class="offerwall-back-btn" onclick="switchView('mainMenu')">⬅ Back to Menu</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    if (tg.requestFullscreen) {
      tg.requestFullscreen();
    } else {
      tg.expand();
    }

    if (tg.disableVerticalSwipes) {
      tg.disableVerticalSwipes();
    }

    // Splash Screen Loading Simulation
    let percentTracker = 0;
    const percentEl = document.getElementById('loaderPercent');
    const barEl = document.getElementById('loaderBar');
    const splashEl = document.getElementById('splash-screen');

    function tickSplash() {
      percentTracker += Math.floor(Math.random() * 8) + 5;
      if (percentTracker >= 100) percentTracker = 100;

      if (percentEl) percentEl.textContent = `${percentTracker}%`;
      if (barEl) barEl.style.width = `${percentTracker}%`;

      if (percentTracker >= 100) {
        setTimeout(() => {
          if (splashEl) splashEl.classList.add('fade-out');
        }, 300);
      } else {
        setTimeout(tickSplash, 150);
      }
    }
    tickSplash();

    const REQUIRED_ADS = 3;
    let adsCount = 0;

    const tgUser = tg.initDataUnsafe?.user;
    const USER_ID = tgUser?.id || "guest";
    const userFirstName = tgUser?.first_name || "User";
    const userPhotoUrl = tgUser?.photo_url || "";

    const profileCard = document.getElementById('userProfileCard');
    const userNameEl = document.getElementById('userName');
    const userIdEl = document.getElementById('userId');
    const userAvatarEl = document.getElementById('userAvatar');

    userNameEl.textContent = userFirstName;
    userIdEl.textContent = `ID: ${USER_ID}`;

    if (userPhotoUrl) {
      userAvatarEl.src = userPhotoUrl;
      profileCard.style.display = 'flex';
    } else {
      userAvatarEl.style.display = 'none';
      profileCard.style.display = 'flex';
    }

    const OFFERWALL_API_KEY = "xX8xgdqTIsgOpXHcngm5uiEaDb1wPM";

    function switchView(viewId) {
      document.getElementById('mainMenu').classList.add('hidden');
      document.getElementById('adsView').classList.add('hidden');
      document.getElementById('offerwallView').classList.add('hidden');
      document.getElementById(viewId).classList.remove('hidden');
    }

    function openOfferwall() {
      const offerwallUrl = `https://offerwall.me/offerwall/${OFFERWALL_API_KEY}/${USER_ID}`;
      document.getElementById('offerwallFrame').src = offerwallUrl;
      switchView('offerwallView');
    }

    function handleAdClick() {
      const btn = document.getElementById('bonusBtn');
      btn.disabled = true;
      btn.innerText = "Opening ad...";

      if (typeof window.showadsbitvex !== 'function') {
        btn.disabled = false;
        updateBtnText();
        tg.showAlert("AdsBitVex SDK is loading. Please try again.");
        return;
      }

      window.showadsbitvex()
        .then(() => {
          adsCount++;
          document.getElementById('adCounter').innerText = `Ads Completed: ${adsCount} / ${REQUIRED_ADS}`;

          if (adsCount < REQUIRED_ADS) {
            btn.disabled = false;
            updateBtnText();
            tg.showAlert(`✅ Ad ${adsCount}/${REQUIRED_ADS} verified! Complete the next one.`);
          } else {
            btn.innerText = "Completed!";
            tg.showAlert("🎉 3 Ads Verified Successfully!", function() {
              tg.close();
            });
          }
        })
        .catch(e => {
          btn.disabled = false;
          updateBtnText();
          tg.showAlert("Ad closed early or unavailable.");
        });
    }

    function updateBtnText() {
      const btn = document.getElementById('bonusBtn');
      btn.innerText = `Watch Ad (${adsCount + 1}/${REQUIRED_ADS})`;
    }
  </script>
</body>
</html>
