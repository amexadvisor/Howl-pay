<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch & Click Ad</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Ads Galaxy SDK (App ID: 57) -->
  <script src="https://app.adsgalaxy.online/sdk.js?id=57"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #121212);
      color: var(--tg-theme-text-color, #ffffff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background-color: var(--tg-theme-secondary-bg-color, #1e1e1e);
      border-radius: 16px;
      padding: 24px 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      border: 3px solid #0088cc;
      box-shadow: 0 4px 12px rgba(0, 136, 204, 0.3);
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .instructions {
      font-size: 14px;
      color: var(--tg-theme-hint-color, #a0a0a0);
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .btn {
      width: 100%;
      background-color: var(--tg-theme-button-color, #0088cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn:disabled {
      background-color: #383838;
      color: #888888;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="https://i.ibb.co/SDdZDqpq/Pokecut-1788095357320.png" alt="Logo" class="logo">
    <div class="title">Bonus Reward</div>
    <div class="instructions">
      Watch and <strong>click on the sponsor ad</strong> to receive <strong>$0.002</strong> directly into your account balance.
    </div>

    <button class="btn" id="bonusBtn" onclick="handleAdClick()">Watch & Click Ad</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    // Get the webhook URL generated by TelebotCreator
    const urlParams = new URLSearchParams(window.location.search);
    const webhookUrl = urlParams.get('webhook');

    function handleAdClick() {
      const btn = document.getElementById('bonusBtn');
      btn.disabled = true;
      btn.innerText = "Opening ad...";

      tg.showConfirm("⚠️ Important: Make sure to click on the sponsor ad!", function(confirmed) {
        if (!confirmed) {
          btn.disabled = false;
          btn.innerText = "Watch & Click Ad";
          return;
        }

        window.showAdsGalaxy()
          .then(function () {
            btn.innerText = "Crediting reward...";
            sendReward();
          })
          .catch(function (error) {
            btn.disabled = false;
            btn.innerText = "Watch & Click Ad";
            if (error.code === "NO_FILL") return tg.showAlert("No ad available right now. Please try again shortly.");
            if (error.code === "INVALID_INIT_DATA") return tg.showAlert("Please launch this app inside Telegram.");
            tg.showAlert("Ad closed early. Complete the ad to continue.");
          });
      });
    }

    async function sendReward() {
      const btn = document.getElementById('bonusBtn');

      if (!webhookUrl) {
        tg.showAlert("Webhook link missing. Please open the Mini-App from the bot button.");
        btn.disabled = false;
        btn.innerText = "Watch & Click Ad";
        return;
      }

      try {
        await fetch(webhookUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ completed: true })
        });

        tg.showAlert("🎉 Bonus verified! Check your bot balance in Telegram.", function() {
          tg.close();
        });
      } catch (err) {
        new Image().src = webhookUrl;
        tg.showAlert("🎉 Bonus verified! Check your bot balance in Telegram.", function() {
          tg.close();
        });
      }
    }
  </script>
</body>
</html>
