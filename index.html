<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch Ads & Earn Bonus</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Ads Galaxy SDK with App ID 57 -->
  <script src="https://app.adsgalaxy.online/sdk.js?id=57"></script>

  <!-- Fallback Logic -->
  <script>
    const previousAdShow = function () {
      return new Promise(function (resolve, reject) {
        reject({ code: "FALLBACK_EMPTY", message: "No fallback provider configured." });
      });
    };

    window.AdsGalaxyFallback = previousAdShow;

    if (window.showAdsGalaxy === undefined) {
      window.showAdsGalaxy = function () {
        return window.AdsGalaxyFallback();
      };
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #121212);
      color: var(--tg-theme-text-color, #ffffff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background-color: var(--tg-theme-secondary-bg-color, #1e1e1e);
      border-radius: 16px;
      padding: 24px 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      border: 3px solid #0088cc;
      box-shadow: 0 4px 12px rgba(0, 136, 204, 0.3);
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .instructions {
      font-size: 14px;
      color: var(--tg-theme-hint-color, #a0a0a0);
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .progress-box {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 20px;
    }
    .counter {
      font-size: 16px;
      font-weight: 600;
      color: #00d26a;
    }
    .btn {
      width: 100%;
      background-color: var(--tg-theme-button-color, #0088cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn:disabled {
      background-color: #383838;
      color: #888888;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="https://i.ibb.co/SDdZDqpq/Pokecut-1788095357320.png" alt="Logo" class="logo">
    <div class="title">Bonus Reward</div>
    <div class="instructions">
      Watch and interact with the sponsored ad. Once completed, <strong>$0.005</strong> will be credited directly to your bot balance.
    </div>

    <div class="progress-box">
      <div class="counter" id="adCounter">Ads Watched: 0 / 1</div>
    </div>

    <button class="btn" id="bonusBtn" onclick="handleAdClick()">Get Bonus</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    const BOT_USERNAME = "advancedet_bot";
    const REQUIRED_ADS = 1;
    let adsCount = 0;

    function handleAdClick() {
      tg.showConfirm("Ready to watch the ad?", function(confirmed) {
        if (confirmed) {
          showAd();
        }
      });
    }

    function showAd() {
      window.showAdsGalaxy()
        .then(function (result) {
          adsCount++;
          document.getElementById('adCounter').innerText = `Ads Watched: ${adsCount} / ${REQUIRED_ADS}`;

          if (adsCount >= REQUIRED_ADS) {
            const btn = document.getElementById('bonusBtn');
            btn.disabled = true;
            btn.innerText = "Claiming reward...";

            tg.showAlert("🎉 Ad completed! Redirecting back to bot to claim $0.005...", function() {
              tg.openTelegramLink(`https://t.me/${BOT_USERNAME}?start=CLAIM_BONUS_ADS`);
              tg.close();
            });
          }
        })
        .catch(function (error) {
          if (error.code === "NO_FILL") {
            tg.showAlert("No ad available right now. Please try again in a moment.");
            return;
          }
          if (error.code === "INVALID_INIT_DATA") {
            tg.showAlert("Please launch this app inside Telegram.");
            return;
          }
          if (error.code === "APP_NOT_READY") {
            tg.showAlert("App is not ready for ads. Please try again later.");
            return;
          }
          tg.showAlert("Ad was closed early or failed to complete.");
          console.log(error.message);
        });
    }
  </script>
</body>
</html>
