<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Earning Hub Mini App</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- AdsBitVex SDK (App ID: 000402) -->
  <script src="https://adsbitvex.com/sdk.js?id=000402"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #121212);
      color: var(--tg-theme-text-color, #ffffff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      text-align: center;
      overflow-y: auto;
    }
    .card {
      background-color: var(--tg-theme-secondary-bg-color, #1e1e1e);
      border-radius: 16px;
      padding: 24px 20px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      border: 3px solid #0088cc;
      box-shadow: 0 4px 12px rgba(0, 136, 204, 0.3);
    }
    .profile-section {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 12px 16px;
      width: 100%;
      margin-bottom: 16px;
      text-align: left;
    }
    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #0088cc;
      background-color: #383838;
      flex-shrink: 0;
    }
    .user-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .name {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .userid {
      font-size: 12px;
      color: var(--tg-theme-hint-color, #a0a0a0);
      font-family: monospace;
      margin-top: 2px;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .instructions {
      font-size: 14px;
      color: var(--tg-theme-hint-color, #a0a0a0);
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .progress-box {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 20px;
    }
    .counter {
      font-size: 16px;
      font-weight: 600;
      color: #00d26a;
    }
    .btn {
      width: 100%;
      background-color: var(--tg-theme-button-color, #0088cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
      margin-bottom: 12px;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn:disabled {
      background-color: #383838;
      color: #888888;
      cursor: not-allowed;
    }
    .btn-secondary {
      background-color: transparent;
      border: 2px solid var(--tg-theme-button-color, #0088cc);
      color: var(--tg-theme-button-text-color, #ffffff);
    }
    .back-btn {
      background-color: #383838;
      margin-top: 12px;
      margin-bottom: 0;
    }
    .hidden {
      display: none !important;
    }

    /* REDUCED SIZE OFFERWALL VIEW WITH BOTTOM BACK BUTTON */
    #offerwallView {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }
    .offerwall-wrapper {
      width: 100%;
      max-width: 380px;
      height: 75vh;
      background-color: var(--tg-theme-secondary-bg-color, #1e1e1e);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .offerwall-iframe-container {
      width: 100%;
      flex-grow: 1;
      overflow: hidden;
    }
    #offerwallFrame {
      width: 100%;
      height: 100%;
      border: none;
    }
    .offerwall-footer {
      width: 100%;
      padding: 12px 16px;
      background-color: var(--tg-theme-secondary-bg-color, #1e1e1e);
      display: flex;
      justify-content: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .offerwall-back-btn {
      background-color: #383838;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- MAIN MENU VIEW -->
  <div class="card" id="mainMenu">
    <img src="https://i.ibb.co/SDdZDqpq/Pokecut-1788095357320.png" alt="Logo" class="logo">
    
    <!-- User Profile Dashboard Card -->
    <div class="profile-section" id="userProfileCard" style="display: none;">
      <img id="userAvatar" class="avatar" src="" alt="Avatar">
      <div class="user-info">
        <div id="userName" class="name">Loading...</div>
        <div id="userId" class="userid">ID: --</div>
      </div>
    </div>

    <div class="title">Earning Hub</div>
    <div class="instructions">
      Choose an option below to start earning rewards directly to your account.
    </div>

    <button class="btn" onclick="switchView('adsView')">📺 Watch Ads</button>
    <button class="btn btn-secondary" onclick="openOfferwall()">📋 Offerwall & Surveys</button>
  </div>

  <!-- ADS VIEW -->
  <div class="card hidden" id="adsView">
    <div class="title">Watch & Click Ads</div>
    <div class="instructions">
      Watch and <strong>click on 3 sponsor ads</strong> to receive rewards.
    </div>

    <div class="progress-box">
      <div class="counter" id="adCounter">Ads Completed: 0 / 3</div>
    </div>

    <button class="btn" id="bonusBtn" onclick="handleAdClick()">Watch & Click Ad (1/3)</button>
    <button class="btn back-btn" onclick="switchView('mainMenu')">⬅ Back to Menu</button>
  </div>

  <!-- REDUCED OFFERWALL MODAL/CONTAINER VIEW -->
  <div class="hidden" id="offerwallView">
    <div class="offerwall-wrapper">
      <div class="offerwall-iframe-container">
        <iframe id="offerwallFrame" src="" allowpaymentrequest></iframe>
      </div>
      <div class="offerwall-footer">
        <button class="offerwall-back-btn" onclick="switchView('mainMenu')">⬅ Back to Menu</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    if (tg.requestFullscreen) {
      tg.requestFullscreen();
    } else {
      tg.expand();
    }

    if (tg.disableVerticalSwipes) {
      tg.disableVerticalSwipes();
    }

    const REQUIRED_ADS = 3;
    let adsCount = 0;

    const tgUser = tg.initDataUnsafe?.user;
    const USER_ID = tgUser?.id || "guest";
    const userFirstName = tgUser?.first_name || "User";
    const userPhotoUrl = tgUser?.photo_url || "";

    const profileCard = document.getElementById('userProfileCard');
    const userNameEl = document.getElementById('userName');
    const userIdEl = document.getElementById('userId');
    const userAvatarEl = document.getElementById('userAvatar');

    userNameEl.textContent = userFirstName;
    userIdEl.textContent = `ID: ${USER_ID}`;

    if (userPhotoUrl) {
      userAvatarEl.src = userPhotoUrl;
      profileCard.style.display = 'flex';
    } else {
      userAvatarEl.style.display = 'none';
      profileCard.style.display = 'flex';
    }

    const OFFERWALL_API_KEY = "xX8xgdqTIsgOpXHcngm5uiEaDb1wPM";
    const urlParams = new URLSearchParams(window.location.search);
    const webhookUrl = urlParams.get('webhook');

    function switchView(viewId) {
      document.getElementById('mainMenu').classList.add('hidden');
      document.getElementById('adsView').classList.add('hidden');
      document.getElementById('offerwallView').classList.add('hidden');
      document.getElementById(viewId).classList.remove('hidden');
    }

    function openOfferwall() {
      const offerwallUrl = `https://offerwall.me/offerwall/${OFFERWALL_API_KEY}/${USER_ID}`;
      document.getElementById('offerwallFrame').src = offerwallUrl;
      switchView('offerwallView');
    }

    function handleAdClick() {
      const btn = document.getElementById('bonusBtn');
      btn.disabled = true;
      btn.innerText = "Opening ad...";

      tg.showConfirm("⚠️ Important: Make sure to click on the sponsor ad!", function(confirmed) {
        if (!confirmed) {
          btn.disabled = false;
          updateBtnText();
          return;
        }

        // Updated function call to trigger AdsBitVex SDK (App ID: 000402)
        window.showAdsBitVex()
          .then(function () {
            adsCount++;
            document.getElementById('adCounter').innerText = `Ads Completed: ${adsCount} / ${REQUIRED_ADS}`;

            if (adsCount < REQUIRED_ADS) {
              btn.disabled = false;
              updateBtnText();
              tg.showAlert(`✅ Ad ${adsCount}/${REQUIRED_ADS} verified! Complete the next one.`);
            } else {
              btn.innerText = "Crediting reward...";
              sendReward();
            }
          })
          .catch(function (error) {
            btn.disabled = false;
            updateBtnText();
            if (error.code === "NO_FILL") return tg.showAlert("No ad available right now. Please try again shortly.");
            if (error.code === "INVALID_INIT_DATA") return tg.showAlert("Please launch this app inside Telegram.");
            tg.showAlert("Ad closed early. Complete the full ad to continue.");
          });
      });
    }

    function updateBtnText() {
      const btn = document.getElementById('bonusBtn');
      btn.innerText = `Watch & Click Ad (${adsCount + 1}/${REQUIRED_ADS})`;
    }

    async function sendReward() {
      const btn = document.getElementById('bonusBtn');

      if (!webhookUrl) {
        tg.showAlert("Webhook link missing. Please open the Mini-App from the bot button.");
        btn.disabled = false;
        updateBtnText();
        return;
      }

      try {
        await fetch(webhookUrl, {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "X-Telegram-Init-Data": tg.initData
          },
          body: JSON.stringify({ completed: true })
        });

        tg.showAlert("🎉 3 Ads Verified! Check your bot balance in Telegram.", function() {
          tg.close();
        });
      } catch (err) {
        new Image().src = webhookUrl;
        tg.showAlert("🎉 3 Ads Verified! Check your bot balance in Telegram.", function() {
          tg.close();
        });
      }
    }
  </script>
</body>
</html>
