<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>HOWL | Elite Earning Platform</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://sdk.adsbitvex.com/functions/v1/ad-script?appid=000402"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: #070c0e;
      --card: #12191b;
      --card-alt: #0f2a25;
      --hairline: rgba(255, 255, 255, 0.07);
      --mint: #34d399;
      --mint-dim: #10b981;
      --mint-soft: rgba(52, 211, 153, 0.12);
      --mint-glow: rgba(52, 211, 153, 0.28);
      --amber: #f5b942;
      --text: #f5f7f8;
      --text-muted: #8b959a;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; padding: 0; background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center;
      height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased;
    }

    /* ============ Splash Animation ============ */
    #splash-screen {
      position: absolute; inset: 0; background: var(--bg); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }
    #splash-screen.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }

    .howl-glow {
      position: absolute; top: 22%; left: 50%; width: 320px; height: 320px; border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, var(--mint-soft) 0%, transparent 70%);
      animation: moonPulse 3.2s ease-in-out infinite;
    }
    @keyframes moonPulse { 0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } }

    .howl-rings { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .howl-rings .ring {
      position: absolute; border-radius: 50%; border: 1px solid var(--mint-glow);
      animation: sonar 2.6s cubic-bezier(0.2, 0.6, 0.4, 1) infinite; opacity: 0;
    }
    .howl-rings .r1 { animation-delay: 0s; }
    .howl-rings .r2 { animation-delay: 0.87s; }
    .howl-rings .r3 { animation-delay: 1.74s; }
    @keyframes sonar { 0% { width: 88px; height: 88px; opacity: 0.5; } 100% { width: 320px; height: 320px; opacity: 0; } }

    .splash-logo-container {
      position: relative; width: 88px; height: 88px; display: flex; align-items: center; justify-content: center;
      margin-bottom: 24px; z-index: 2; animation: logoRise 0.7s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes logoRise { from { opacity: 0; transform: translateY(12px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }

    .splash-logo {
      width: 88px; height: 88px; border-radius: 24px;
      background: var(--card);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      border: 1px solid var(--hairline);
      box-shadow: 0 0 28px var(--mint-glow);
    }
    .splash-logo img { width: 100%; height: 100%; object-fit: cover; }

    .splash-title-wrapper { text-align: center; z-index: 2; margin-bottom: 22px; }
    .splash-title {
      font-family: 'Inter', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: 0.5px; color: var(--text);
      margin: 0 0 6px 0;
      animation: fadeIn 0.6s ease both 0.15s; opacity: 0;
    }
    @keyframes fadeIn { to { opacity: 1; } }
    .splash-subtitle {
      font-size: 12px; font-weight: 600; color: var(--text-muted);
      opacity: 0; animation: fadeIn 0.5s ease both 0.45s;
    }

    .splash-loader-container { width: 200px; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .splash-loader { width: 100%; height: 4px; background: rgba(255,255,255,0.08); border-radius: 4px; position: relative; overflow: hidden; }
    .splash-loader-bar {
      position: absolute; top: 0; left: 0; height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--mint-dim), var(--mint));
      border-radius: 4px; transition: width 0.25s ease-out;
    }
    .splash-percentage { font-family: 'Inter', monospace; font-size: 11px; color: var(--text-muted); font-weight: 600; }

    /* ============ Shell Layout ============ */
    .container {
      width: 100%; height: 100%; max-width: 410px; background: var(--bg);
      display: flex; flex-direction: column; overflow: hidden; position: relative;
      border-left: 1px solid var(--hairline); border-right: 1px solid var(--hairline);
    }

    .live-dashboard-bg { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .live-grid { position: absolute; top: -10%; left: 0; width: 100%; height: 240px; background: radial-gradient(ellipse at 50% 0%, var(--mint-soft) 0%, transparent 70%); }

    main { flex-grow: 1; overflow-y: auto; padding: 18px; padding-bottom: 100px; z-index: 1; position: relative; }
    main::-webkit-scrollbar { width: 3px; }
    main::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }

    .view { display: none; }
    .view.active { display: block; }

    @keyframes riseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .view.active > * { animation: riseIn 0.45s cubic-bezier(0.16,1,0.3,1) both; }

    /* ============ Tabs ============ */
    .earn-category-tabs {
      display: flex; gap: 4px; margin-bottom: 16px; background: var(--card);
      padding: 4px; border-radius: 14px; border: 1px solid var(--hairline); position: relative;
    }
    .tab-pill {
      position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 2);
      background: var(--mint); border-radius: 10px;
      transform: translateX(calc(var(--active-index, 0) * 100%));
      transition: transform 0.35s cubic-bezier(0.65,0,0.35,1);
    }
    .category-tab {
      flex: 1; padding: 10px 4px; text-align: center; font-size: 12px; font-weight: 700;
      color: var(--text-muted); background: transparent; border: none; border-radius: 10px;
      cursor: pointer; transition: color 0.25s ease; position: relative; z-index: 1;
    }
    .category-tab:hover { color: var(--text); }
    .category-tab.active { color: #06120e; }

    .earn-section-panel { display: none; }
    .earn-section-panel.active { display: block; }

    .offerwall-iframe-container {
      width: calc(100% + 36px); margin-left: -18px; height: 480px; background: var(--card);
      border-radius: 16px; border: 1px solid var(--hairline); overflow: hidden; position: relative;
    }
    .offerwall-iframe-container iframe { width: 100%; height: 100%; border: none; background: transparent; }

    /* ============ User header ============ */
    .user-header-card {
      background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 18px;
      display: flex; align-items: center; border: 1px solid var(--hairline);
    }
    .user-avatar {
      width: 48px; height: 48px; border-radius: 14px; margin-right: 14px; overflow: hidden;
      background: var(--card-alt);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; color: var(--mint);
      border: 1px solid var(--hairline); flex-shrink: 0;
    }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .user-info .username { font-size: 16px; font-weight: 800; margin: 0; color: var(--text); }
    .user-info .badge-container { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
    .user-info .title { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    .live-indicator {
      display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700;
      color: var(--mint); background: var(--mint-soft); padding: 3px 9px; border-radius: 20px;
    }
    .live-dot { width: 5px; height: 5px; background: var(--mint); border-radius: 50%; animation: pulseDot 1.8s infinite; }
    @keyframes pulseDot { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

    /* ============ Progress ============ */
    .progress-section { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 18px; border: 1px solid var(--hairline); }
    .progress-info { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--text-muted); }
    .progress-info span:last-child { color: var(--mint); }

    .section-title { font-size: 15px; font-weight: 800; margin-bottom: 12px; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .section-title i { color: var(--mint); font-size: 13px; }

    /* ============ Task cards ============ */
    .task-card {
      background: var(--card); border-radius: 16px; padding: 15px; margin-bottom: 10px;
      display: flex; align-items: center; cursor: pointer;
      transition: border-color 0.2s ease, transform 0.15s ease;
      border: 1px solid var(--hairline); border-left: 3px solid transparent;
    }
    .task-card:hover { border-color: var(--mint-glow); }
    .task-card:active { transform: scale(0.985); }
    .task-card.cooldown-active { opacity: 0.5; cursor: not-allowed; }

    .task-icon {
      font-size: 18px; color: var(--mint); background: var(--card-alt);
      width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
      margin-right: 14px; flex-shrink: 0;
    }
    .task-details { flex-grow: 1; }
    .task-details h3 { margin: 0; font-size: 14px; font-weight: 700; color: var(--text); }
    .task-details p { margin: 4px 0 0; font-size: 12px; color: var(--text-muted); font-weight: 500; }

    .task-action-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; margin-left: 10px; flex-shrink: 0; }
    .task-arrow {
      width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.04);
      display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-muted);
      border: 1px solid var(--hairline);
    }
    .cooldown-badge {
      font-size: 10px; font-weight: 700; color: var(--mint); background: var(--mint-soft);
      padding: 3px 9px; border-radius: 20px; display: none; white-space: nowrap;
    }

    /* ============ Footer nav ============ */
    .footer-nav {
      position: fixed; bottom: 0; left: 0; right: 0; width: 100%; max-width: 410px; margin: 0 auto;
      display: flex; background: rgba(7, 12, 14, 0.94);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      padding: 10px 4px 16px 4px; border-top: 1px solid var(--hairline); z-index: 100;
    }
    .nav-button {
      flex: 1; display: flex; flex-direction: column; align-items: center; color: var(--text-muted);
      background: transparent; border: none; font-size: 10px; font-weight: 700; cursor: pointer; padding: 8px 2px;
      transition: color 0.25s ease;
    }
    .nav-button .icon { font-size: 17px; margin-bottom: 5px; }
    .nav-button:hover { color: var(--text); }
    .nav-button.active { color: var(--mint); }
  </style>
</head>
<body>

  <div id="splash-screen">
    <div class="howl-glow"></div>
    <div class="howl-rings">
      <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
    </div>

    <div class="splash-logo-container">
      <div class="splash-logo">
        <img src="https://i.ibb.co/SDdZDqpq/Pokecut-1788095357320.png" alt="HOWL Emblem">
      </div>
    </div>

    <div class="splash-title-wrapper">
      <h1 class="splash-title">HOWL</h1>
      <div class="splash-subtitle">Elite Earning Protocol</div>
    </div>

    <div class="splash-loader-container">
      <div class="splash-loader"><div class="splash-loader-bar" id="loaderBar"></div></div>
      <div class="splash-percentage" id="loaderPercent">0%</div>
    </div>
  </div>

  <div class="container">
    <div class="live-dashboard-bg">
      <div class="live-grid"></div>
    </div>

    <main id="main-content">
      <div id="home-view" class="view active">
        <div class="user-header-card">
          <div class="user-avatar" id="profile-pic">
            <img src="https://i.ibb.co/SDdZDqpq/Pokecut-1788095357320.png" alt="Avatar">
          </div>
          <div class="user-info">
            <h2 class="username" id="username">Loading...</h2>
            <div class="badge-container">
              <span class="title"><i class="fa-solid fa-shield-halved" style="color:var(--mint);"></i> Verified Earner</span>
              <div class="live-indicator"><span class="live-dot"></span> LIVE</div>
            </div>
          </div>
        </div>

        <div class="progress-section">
          <div class="progress-info">
            <span>Ads Watched Today</span>
            <span id="adsbitvex-count-today">0 / 3</span>
          </div>
        </div>

        <h2 class="section-title"><i class="fa-solid fa-bolt"></i> Quick Navigation</h2>
        <div class="task-card" onclick="showView('tasks-view')">
            <div class="task-icon"><i class="fa-solid fa-rocket"></i></div>
            <div class="task-details"><h3>Launch Earning Hub</h3><p>Execute monetization tasks and collect rewards.</p></div>
            <div class="task-arrow"><i class="fa-solid fa-chevron-right"></i></div>
        </div>
      </div>

      <div id="tasks-view" class="view">
        <div class="earn-category-tabs" id="earn-tabs" style="--active-index: 0;">
          <div class="tab-pill"></div>
          <button class="category-tab active" id="tab-ads" onclick="switchEarnTab('ads')">Ads</button>
          <button class="category-tab" id="tab-offerwall" onclick="switchEarnTab('offerwall')">Offerwall</button>
        </div>

        <div id="panel-ads" class="earn-section-panel active">
          <h2 class="section-title"><i class="fa-solid fa-rectangle-ad"></i> Active Ad Modules</h2>
          
          <div class="task-card" id="adsbitvexCard" onclick="startAdsBitvexTask()">
              <div class="task-icon"><i class="fa-solid fa-fire"></i></div>
              <div class="task-details">
                <h3>Watch Ad (<span id="adStepIndicator">1/3</span>)</h3>
                <p>Complete 3 successful ad views to trigger reward.</p>
              </div>
              <div class="task-action-meta">
                <span id="adsbitvexCD" class="cooldown-badge">5s</span>
                <div class="task-arrow" id="adsbitvexArrow"><i class="fa-solid fa-play"></i></div>
              </div>
          </div>
        </div>

        <div id="panel-offerwall" class="earn-section-panel">
          <h2 class="section-title"><i class="fa-solid fa-gift"></i> Partner Offerwall</h2>
          <div class="offerwall-iframe-container">
            <iframe id="offerwall-iframe" src="" title="Offerwall"></iframe>
          </div>
        </div>
      </div>
    </main>

    <nav class="footer-nav">
      <button class="nav-button active" onclick="showView('home-view')"><div class="icon"><i class="fa-solid fa-house"></i></div>Home</button>
      <button class="nav-button" onclick="showView('tasks-view')"><div class="icon"><i class="fa-solid fa-bolt"></i></div>Earn</button>
      <button class="nav-button" onclick="shareApp()"><div class="icon"><i class="fa-solid fa-share-nodes"></i></div>Share</button>
    </nav>
  </div>

<script>
    let adsCountToday = 0;
    let tgUser = null;
    let currentUserId = 'guest_user';
    let adsbitvexInFlight = false;
    let adsbitvexLastRun = 0;

    const urlParams = new URLSearchParams(window.location.search);
    const webhookUrl = urlParams.get('webhook');

    document.addEventListener('DOMContentLoaded', () => {
        initApp();
        setInterval(updateCooldownTimers, 1000);
        
        let percentTracker = 0;
        const percentEl = document.getElementById('loaderPercent');
        const barEl = document.getElementById('loaderBar');
        const splashEl = document.getElementById('splash-screen');

        function tickSplash() {
            percentTracker += Math.floor(Math.random() * 8) + 4;
            if (percentTracker >= 100) percentTracker = 100;

            if (percentEl) percentEl.textContent = `${percentTracker}%`;
            if (barEl) barEl.style.width = `${percentTracker}%`;

            if (percentTracker >= 100) {
                setTimeout(() => {
                    if (splashEl) splashEl.classList.add('fade-out');
                }, 350);
            } else {
                setTimeout(tickSplash, 180);
            }
        }
        tickSplash();
    });

    function initApp() {
        try {
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
                if (Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user) {
                    tgUser = Telegram.WebApp.initDataUnsafe.user;
                }
            }
        } catch (e) {}

        currentUserId = tgUser && tgUser.id ? tgUser.id.toString() : 'guest_user';
        loadTelegramUser();
        setupOfferwallIframe();
        showView('home-view');
        checkStoredCooldowns();
        updateDisplayCounters();
    }

    function setupOfferwallIframe() {
        const iframe = document.getElementById('offerwall-iframe');
        if (iframe) {
            const offerwallApiKey = "xX8xgdqTIsgOpXHcngm5uiEaDb1wPM";
            iframe.src = `https://offerwall.me/offerwall/${offerwallApiKey}/${currentUserId}`;
        }
    }

    function showView(viewId) {
        document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
        const targetView = document.getElementById(viewId);
        if (targetView) targetView.classList.add('active');
        
        document.querySelectorAll('.nav-button').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.querySelector(`.nav-button[onclick="showView('${viewId}')"]`);
        if (activeBtn) activeBtn.classList.add('active');
    }

    const TAB_ORDER = ['ads', 'offerwall'];

    function switchEarnTab(tabName) {
        document.querySelectorAll('#tasks-view .category-tab').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('#tasks-view .earn-section-panel').forEach(panel => panel.classList.remove('active'));

        const targetTab = document.getElementById(`tab-${tabName}`);
        const targetPanel = document.getElementById(`panel-${tabName}`);
        if (targetTab) targetTab.classList.add('active');
        if (targetPanel) targetPanel.classList.add('active');
        
        const tabsContainer = document.getElementById('earn-tabs');
        if (tabsContainer) {
            tabsContainer.style.setProperty('--active-index', TAB_ORDER.indexOf(tabName));
        }
    }

    function checkStoredCooldowns() {
        const storedAdsbitvex = localStorage.getItem(`howl_adsbitvex_cd_${currentUserId}`);
        if (storedAdsbitvex) adsbitvexLastRun = parseInt(storedAdsbitvex) || 0;
        
        const storedCount = localStorage.getItem(`howl_ads_count_${currentUserId}`);
        if (storedCount) adsCountToday = parseInt(storedCount) || 0;
    }

    function updateCooldownTimers() {
        const now = Date.now();
        const adsbitvexDiff = Math.floor((now - adsbitvexLastRun) / 1000);
        const adsbitvexCard = document.getElementById('adsbitvexCard');
        const adsbitvexCD = document.getElementById('adsbitvexCD');
        const adsbitvexArrow = document.getElementById('adsbitvexArrow');

        if (adsbitvexCard && adsbitvexCD && adsbitvexArrow) {
            if (adsbitvexInFlight || adsbitvexDiff < 5) {
                const left = Math.max(0, 5 - adsbitvexDiff);
                adsbitvexCard.classList.add('cooldown-active');
                adsbitvexCD.style.display = 'inline-block';
                adsbitvexCD.textContent = adsbitvexInFlight ? '…' : `${left}s`;
                adsbitvexArrow.style.display = 'none';
            } else {
                adsbitvexCard.classList.remove('cooldown-active');
                adsbitvexCD.style.display = 'none';
                adsbitvexArrow.style.display = 'flex';
            }
        }
    }

    function updateDisplayCounters() {
        const countDisplay = `${adsCountToday} / 3`;
        const countEl = document.getElementById('adsbitvex-count-today');
        const stepEl = document.getElementById('adStepIndicator');
        
        if (countEl) countEl.textContent = countDisplay;
        if (stepEl) stepEl.textContent = `${(adsCountToday % 3) + 1}/3`;
    }

    function loadTelegramUser() {
        const profilePicDiv = document.getElementById('profile-pic');
        const usernameDiv = document.getElementById('username');

        if (tgUser) {
            const fullName = tgUser.first_name + (tgUser.last_name ? ' ' + tgUser.last_name : '');
            if (usernameDiv) usernameDiv.textContent = fullName || 'Telegram User';
            if (profilePicDiv) {
                if (tgUser.photo_url) {
                    profilePicDiv.innerHTML = `<img src="${tgUser.photo_url}" alt="Avatar">`;
                } else {
                    profilePicDiv.innerHTML = `<span>${(tgUser.first_name || 'U').charAt(0)}</span>`;
                }
            }
        } else {
            if (usernameDiv) usernameDiv.textContent = 'Web Operator';
            if (profilePicDiv) {
                profilePicDiv.innerHTML = `<img src="https://i.ibb.co/SDdZDqpq/Pokecut-1788095357320.png" alt="Avatar">`;
            }
        }
    }

    function startAdsBitvexTask() {
        if (adsbitvexInFlight) return;

        const now = Date.now();
        if (now - adsbitvexLastRun < 5000) {
            const left = Math.ceil((5000 - (now - adsbitvexLastRun)) / 1000);
            return alert(`⏳ Cooldown active! Please wait ${left}s.`);
        }

        if (typeof window.showadsbitvex !== 'function') {
            return alert('AdsBitvex SDK not loaded properly. Please refresh or check connection.');
        }

        adsbitvexInFlight = true;

        window.showadsbitvex().then(() => {
            adsbitvexLastRun = Date.now();
            localStorage.setItem(`howl_adsbitvex_cd_${currentUserId}`, adsbitvexLastRun.toString());
            adsbitvexInFlight = false;

            adsCountToday += 1;
            localStorage.setItem(`howl_ads_count_${currentUserId}`, adsCountToday.toString());
            updateDisplayCounters();

            if (adsCountToday >= 3) {
                sendRewardWebhook();
            } else {
                alert(`✅ Ad ${adsCountToday}/3 completed! Watch the next one.`);
            }
        }).catch((e) => {
            adsbitvexLastRun = Date.now();
            localStorage.setItem(`howl_adsbitvex_cd_${currentUserId}`, adsbitvexLastRun.toString());
            adsbitvexInFlight = false;
            alert('⚠️ Ad closed early or failed to load.');
        });
    }

    async function sendRewardWebhook() {
        if (!webhookUrl) {
            alert("🎉 3 Ads Verified Successfully! Check your Telegram bot balance.");
            if (window.Telegram && Telegram.WebApp) Telegram.WebApp.close();
            return;
        }

        try {
            await fetch(webhookUrl, {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "X-Telegram-Init-Data": window.Telegram.WebApp.initData
                },
                body: JSON.stringify({ completed: true })
            });
            alert("🎉 3 Ads Verified! Check your bot balance in Telegram.", function() {
                if (window.Telegram && Telegram.WebApp) Telegram.WebApp.close();
            });
        } catch (err) {
            new Image().src = webhookUrl;
