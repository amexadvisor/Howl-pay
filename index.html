<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Earning Hub Mini App</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Ads Galaxy SDK (App ID: 57) -->
  <script src="https://app.adsgalaxy.online/sdk.js?id=57"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #121212);
      color: var(--tg-theme-text-color, #ffffff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      text-align: center;
      overflow-y: auto;
    }
    .card {
      background-color: var(--tg-theme-secondary-bg-color, #1e1e1e);
      border-radius: 16px;
      padding: 24px 20px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      border: 3px solid #0088cc;
      box-shadow: 0 4px 12px rgba(0, 136, 204, 0.3);
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .instructions {
      font-size: 14px;
      color: var(--tg-theme-hint-color, #a0a0a0);
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .progress-box {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 20px;
    }
    .counter {
      font-size: 16px;
      font-weight: 600;
      color: #00d26a;
    }
    .btn {
      width: 100%;
      background-color: var(--tg-theme-button-color, #0088cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
      margin-bottom: 12px;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn:disabled {
      background-color: #383838;
      color: #888888;
      cursor: not-allowed;
    }
    .btn-secondary {
      background-color: transparent;
      border: 2px solid var(--tg-theme-button-color, #0088cc);
      color: var(--tg-theme-button-text-color, #ffffff);
    }
    .back-btn {
      background-color: #383838;
      margin-top: 12px;
      margin-bottom: 0;
    }
    .hidden {
      display: none !important;
    }
    .survey-list {
      width: 100%;
      max-height: 450px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 5px;
    }
    .survey-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 14px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .survey-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--tg-theme-hint-color, #a0a0a0);
    }
    .survey-reward {
      color: #00d26a;
      font-weight: 600;
    }
    .survey-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--tg-theme-text-color, #ffffff);
    }
    .start-survey-btn {
      background-color: var(--tg-theme-button-color, #0088cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      margin-top: 4px;
    }
    .loading-text, .empty-text {
      font-size: 14px;
      color: var(--tg-theme-hint-color, #a0a0a0);
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <!-- MAIN MENU VIEW -->
  <div class="card" id="mainMenu">
    <img src="https://i.ibb.co/SDdZDqpq/Pokecut-1788095357320.png" alt="Logo" class="logo">
    <div class="title">Earning Hub</div>
    <div class="instructions">
      Choose an option below to start earning rewards directly to your account.
    </div>

    <button class="btn" onclick="switchView('adsView')">📺 Watch Ads</button>
    <button class="btn btn-secondary" onclick="switchView('surveyView')">📋 Complete Surveys</button>
  </div>

  <!-- ADS VIEW -->
  <div class="card hidden" id="adsView">
    <div class="title">Watch & Click Ads</div>
    <div class="instructions">
      Watch and <strong>click on 3 sponsor ads</strong> to receive rewards.
    </div>

    <div class="progress-box">
      <div class="counter" id="adCounter">Ads Completed: 0 / 3</div>
    </div>

    <button class="btn" id="bonusBtn" onclick="handleAdClick()">Watch & Click Ad (1/3)</button>
    <button class="btn back-btn" onclick="switchView('mainMenu')">⬅ Back to Menu</button>
  </div>

  <!-- SURVEY VIEW -->
  <div class="card hidden" id="surveyView" style="max-width: 400px;">
    <div class="title" style="margin-bottom: 4px;">Available Surveys</div>
    <div class="instructions" style="margin-bottom: 12px;">Complete surveys below to earn rewards.</div>
    
    <div id="surveyContainer" class="survey-list">
      <div class="loading-text">Loading available surveys...</div>
    </div>

    <button class="btn back-btn" onclick="switchView('mainMenu')">⬅ Back to Menu</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    if (tg.requestFullscreen) {
      tg.requestFullscreen();
    } else {
      tg.expand();
    }

    if (tg.disableVerticalSwipes) {
      tg.disableVerticalSwipes();
    }

    const REQUIRED_ADS = 3;
    let adsCount = 0;

    const USER_ID = tg.initDataUnsafe?.user?.id || "guest";
    const CLOUD_STORAGE_KEY = "ad_cooldown_" + USER_ID;
    
    const urlParams = new URLSearchParams(window.location.search);
    const webhookUrl = urlParams.get('webhook');

    let surveysLoaded = false;

    function switchView(viewId) {
      document.getElementById('mainMenu').classList.add('hidden');
      document.getElementById('adsView').classList.add('hidden');
      document.getElementById('surveyView').classList.add('hidden');

      document.getElementById(viewId).classList.remove('hidden');

      if (viewId === 'surveyView' && !surveysLoaded) {
        fetchSurveysSecurely();
      }
    }

    async function fetchSurveysSecurely() {
      const container = document.getElementById('surveyContainer');
      try {
        const response = await fetch('/api/surveys', {
          method: 'GET',
          headers: {
            'X-Telegram-Init-Data': tg.initData
          }
        });

        if (!response.ok) {
          throw new Error("Unauthorized request");
        }

        const data = await response.json();
        surveysLoaded = true;
        container.innerHTML = "";

        const surveys = Array.isArray(data) ? data : (data.surveys || data.data || []);

        if (surveys.length === 0) {
          container.innerHTML = `<div class="empty-text">No surveys available right now. Please check back later!</div>`;
          return;
        }

        surveys.forEach(survey => {
          const title = survey.title || survey.name || "Paid Survey";
          const reward = survey.reward || survey.payout || "$0.00";
          const duration = survey.duration || survey.time || "5 mins";
          const link = survey.url || survey.link;

          const item = document.createElement('div');
          item.className = 'survey-item';
          item.innerHTML = `
            <div class="survey-info">
              <span>⏱ ${duration}</span>
              <span class="survey-reward">${reward}</span>
            </div>
            <div class="survey-title">${title}</div>
            ${link ? `<a href="${link}" target="_blank" class="start-survey-btn" onclick="openSurveyLink(event, '${link}')">Start Survey</a>` : ''}
          `;
          container.appendChild(item);
        });
      } catch (err) {
        container.innerHTML = `<div class="empty-text">Authentication failed or failed to load surveys.</div>`;
      }
    }

    function openSurveyLink(event, url) {
      event.preventDefault();
      if (tg.openLink) {
        tg.openLink(url);
      } else {
        window.open(url, '_blank');
      }
    }

    function handleAdClick() {
      const btn = document.getElementById('bonusBtn');
      btn.disabled = true;
      btn.innerText = "Opening ad...";

      tg.showConfirm("⚠️ Important: Make sure to click on the sponsor ad!", function(confirmed) {
        if (!confirmed) {
          btn.disabled = false;
          updateBtnText();
          return;
        }

        window.showAdsGalaxy()
          .then(function () {
            adsCount++;
            document.getElementById('adCounter').innerText = `Ads Completed: ${adsCount} / ${REQUIRED_ADS}`;

            if (adsCount < REQUIRED_ADS) {
              btn.disabled = false;
              updateBtnText();
              tg.showAlert(`✅ Ad ${adsCount}/${REQUIRED_ADS} verified! Complete the next one.`);
            } else {
              btn.innerText = "Crediting reward...";
              sendReward();
            }
          })
          .catch(function (error) {
            btn.disabled = false;
            updateBtnText();
            if (error.code === "NO_FILL") return tg.showAlert("No ad available right now. Please try again shortly.");
            if (error.code === "INVALID_INIT_DATA") return tg.showAlert("Please launch this app inside Telegram.");
            tg.showAlert("Ad closed early. Complete the full ad to continue.");
          });
      });
    }

    function updateBtnText() {
      const btn = document.getElementById('bonusBtn');
      btn.innerText = `Watch & Click Ad (${adsCount + 1}/${REQUIRED_ADS})`;
    }

    async function sendReward() {
      const btn = document.getElementById('bonusBtn');

      if (!webhookUrl) {
        tg.showAlert("Webhook link missing. Please open the Mini-App from the bot button.");
        btn.disabled = false;
        updateBtnText();
        return;
      }

      try {
        await fetch(webhookUrl, {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "X-Telegram-Init-Data": tg.initData
          },
          body: JSON.stringify({ completed: true })
        });

        tg.showAlert("🎉 3 Ads Verified! Check your bot balance in Telegram.", function() {
          tg.close();
        });
      } catch (err) {
        new Image().src = webhookUrl;
        tg.showAlert("🎉 3 Ads Verified! Check your bot balance in Telegram.", function() {
          tg.close();
        });
      }
    }
  </script>
</body>
</html>
